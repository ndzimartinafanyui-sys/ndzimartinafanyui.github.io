<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest 1xBet Promo Code - Claim Your Free Bonus</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px 20px; color: #333; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { color: #0052cc; margin-bottom: 10px; font-size: 26px; }
        p { font-size: 16px; color: #666; line-height: 1.5; }
        .code-container { margin: 25px 0; }
        .code-box { background: #eef2f7; border: 2px dashed #0052cc; padding: 15px; font-size: 26px; font-weight: bold; letter-spacing: 2px; color: #0052cc; border-radius: 6px; display: block; margin-bottom: 10px; text-transform: uppercase; }
        .copy-btn { background: #0052cc; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; width: 100%; }
        .copy-btn:hover { background: #0040a3; }
        .cta-btn { display: inline-block; background: #28a745; color: white; padding: 15px 30px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 6px; transition: 0.2s; margin-top: 15px; width: 85%; }
        .cta-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Exclusive 1xBet Promo Code</h1>
    <p>Use the official registration code below to claim your maximum welcome bonus today!</p>
    
    <div class="code-container">
        <!-- 1. REPLACE THE WORD 'BONUS100' WITH YOUR ACTUAL PROMO CODE BELOW -->
        <div class="code-box" id="promoCode">TAYOR1</div>
        <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Promo Code</button>
    </div>
    
    <p>Click below to open 1xBet and register your new account instantly:</p>
    
    <!-- 2. REPLACE THE '#' WITH YOUR ACTUAL 1XPARTNERS AFFILIATE LINK BELOW -->
    <a href="https://reffpa.com/L?tag=d_4761944m_97c_&site=4761944&ad=97" target="_blank" class="cta-btn">Register & Claim Bonus Now</a>
</div>

<script>
function copyToClipboard() {
    var codeText = document.getElementById("promoCode").innerText;
    navigator.clipboard.writeText(codeText).then(function() {
        var btn = document.querySelector('.copy-btn');
        btn.innerText = "✅ Code Copied!";
        btn.style.background = "#28a745";
        setTimeout(function() {
            btn.innerText = "📋 Copy Promo Code";
            btn.style.background = "#0052cc";
        }, 2000);
    }).catch(function(err) {
        alert('Could not copy code automatically. Please select and copy manually.');
    });
}
</script>

</body>
</html>
